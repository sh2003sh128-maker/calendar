      else { var x = dateDiff(a, b); html = '<div class="big">' + n(x.total) + ' يوم</div>' + kv('بالأسابيع', n(x.weeks) + ' أسبوع و' + n(x.rest) + ' يوم') + kv('بالميلادي', ymdT(x.g)) + kv('بالهجري', ymdT(x.h)); }
    }
    el.innerHTML = html;
  }

  function vSettings() {
    return '<div class="card stack"><h2>التقويم الأساسي</h2>' + seg('primary', [['h', 'هجري'], ['g', 'ميلادي']], S.primary) +
      '<div class="mute" style="font-size:12.5px">الرقم الكبير حسب اختيارك، والصغير للتقويم الآخر في كل يوم.</div></div>' +
      '<div class="card"><h2>تعديل التاريخ الهجري</h2><div class="mute" style="font-size:12.5px">إذا اختلف يوم بداية الشهر عندك عن التقويم (رؤية الهلال)، عدّله بيوم أو يومين.</div>' +
      '<div class="step"><button data-act="adj" data-v="1" aria-label="زيادة">＋</button><div class="num">' + (S.adj > 0 ? '+' : '') + n(S.adj) + '<small>' + (S.adj === 0 ? 'حسب أم القرى' : S.adj > 0 ? 'يوم للأمام' : 'يوم للخلف') + '</small></div><button data-act="adj" data-v="-1" aria-label="إنقاص">－</button></div></div>' +
      '<div class="card stack"><h2>بداية الأسبوع</h2>' + seg('weekStart', [[6, 'السبت'], [0, 'الأحد'], [1, 'الإثنين']], S.weekStart) + '<h2 style="margin-top:6px">الأرقام</h2>' + seg('digits', [['true', '١٢٣ عربية'], ['false', '123 إنجليزية']], String(S.digits)) + '</div>' +
      '<div class="card"><h2>عن التطبيق</h2><div class="mute" style="font-size:13px">• التقويم الهجري وفق جدول أم القرى (' + n(HMIN) + ' – ' + n(HMAX) + ' هـ)، والحساب كله داخل الصفحة.<br>• طور القمر تقريبي ولا يغني عن رؤية الهلال الشرعية.<br>• ملاحظاتك محفوظة في متصفح جوالك فقط.</div></div>';
  }

  function render() {
    renderTabs();
    $app.innerHTML = view === 'today' ? vToday() : view === 'month' ? vMonth() : view === 'tools' ? vTools() : vSettings();
    if (view === 'tools') updateTool();
  }

  /* ---------- نافذة اليوم ---------- */
  var ov = document.getElementById('ov'), sheet = document.getElementById('sheet');
  function notesHtml(date) {
    var h = toH(date), list = NOTES.filter(function (x) { return noteHit(x, date, h); });
    if (!list.length) return '<div class="mute" style="font-size:13px;margin-bottom:8px">لا توجد ملاحظات لهذا اليوم</div>';
    return list.map(function (x) { return '<div class="note"><div>' + esc(x.text) + (x.yearly ? '<small>تتكرر كل سنة (' + (x.cal === 'h' ? 'هجري' : 'ميلادي') + ')</small>' : '') + '</div><button data-act="del" data-v="' + x.id + '">حذف</button></div>'; }).join('');
  }
  function openSheet(date) {
    sel = date;
    var h = toH(date), m = moon(date), dow = date.getDay();
    var ev = occ(date, h).map(function (e) { return '<div class="ev"><span class="dot ' + e.type + '"></span>' + esc(e.name) + '</div>'; }).join('');
    sheet.innerHTML = '<div class="mute" style="font-size:13px">' + WD[dow] + '</div><div class="d1">' + (S.primary === 'h' ? fH(h) : fG(date)) + '</div><div class="d2">' + (S.primary === 'h' ? fG(date) : fH(h)) + '</div>' +
      '<div class="moon" style="margin-bottom:10px">' + moonSvg(m.f, 36) + '<div>' + m.name + '، إضاءة ' + n(m.illum) + '٪ (تقريبي)</div></div>' + ev +
      ((dow === 1 || dow === 4) ? '<div class="mute" style="font-size:13px">يُستحب صيام يوم ' + WD[dow] + '</div>' : '') +
      '<h2 style="margin-top:14px">ملاحظاتي</h2><div id="sn">' + notesHtml(date) + '</div>' +
      '<input type="text" id="nt" placeholder="اكتب ملاحظة أو موعدًا…" maxlength="200">' +
      '<label class="chk"><input type="checkbox" id="ny"><span>تكرار سنوي (عيد ميلاد، ذكرى…)</span></label>' +
      '<div id="ncw" hidden style="margin-bottom:10px"><label class="mute" for="nc" style="font-size:12px">يتكرر حسب</label><select id="nc"><option value="h">التاريخ الهجري</option><option value="g">التاريخ الميلادي</option></select></div>' +
      '<div class="row2"><button class="btn" data-act="add">حفظ</button><button class="btn soft" data-act="close">إغلاق</button></div>';
    document.getElementById('nc').value = S.primary;
    ov.hidden = false;
  }
  function closeSheet() { ov.hidden = true; sel = null; render(); }

  /* ---------- الأحداث ---------- */
  document.addEventListener('click', function (e) {
    if (e.target === ov) { closeSheet(); return; }
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), v = b.getAttribute('data-v'), k = b.getAttribute('data-k');
    if (act === 'tab') { view = v; render(); window.scrollTo(0, 0); }
    else if (act === 'day') openSheet(fromKey(k));
    else if (act === 'close') closeSheet();
    else if (act === 'mv') {
      var t = pos.m + (+v), y = pos.y; while (t > 12) { t -= 12; y++; } while (t < 1) { t += 12; y--; }
      if (okYear(y)) { pos = { y: y, m: t }; render(); }
    }
    else if (act === 'goToday') { pos = startPos(); render(); }
    else if (act === 'tool') { tool = v; render(); }
    else if (act === 'tcal') { toolCal[tool] = v; render(); }
    else if (act === 'set') {
      S[k] = (k === 'digits') ? (v === 'true') : (k === 'weekStart' ? +v : v);
      lsSet('hc_settings', S); if (k === 'primary') pos = startPos(); render();
    }
    else if (act === 'adj') { S.adj = Math.max(-2, Math.min(2, S.adj + (+v))); lsSet('hc_settings', S); pos = startPos(); render(); }
    else if (act === 'add' && sel) {
      var txt = document.getElementById('nt').value.trim(); if (!txt) return;
      var yearly = document.getElementById('ny').checked, cal = yearly ? document.getElementById('nc').value : S.primary, h = toH(sel);
      var base = cal === 'h' ? { cal: 'h', y: h.y, m: h.m, d: h.d } : { cal: 'g', y: sel.getFullYear(), m: sel.getMonth() + 1, d: sel.getDate() };
      NOTES.push(Object.assign({ id: String(Date.now()), text: txt, yearly: yearly }, base)); lsSet('hc_notes', NOTES);
      document.getElementById('nt').value = ''; document.getElementById('ny').checked = false; document.getElementById('ncw').hidden = true;
      document.getElementById('sn').innerHTML = notesHtml(sel);
    }
    else if (act === 'del' && sel) { NOTES = NOTES.filter(function (x) { return x.id !== v; }); lsSet('hc_notes', NOTES); document.getElementById('sn').innerHTML = notesHtml(sel); }
  });
  document.addEventListener('input', function (e) { if (e.target.closest('.flds')) updateTool(); });
  document.addEventListener('change', function (e) { if (e.target.id === 'ny') document.getElementById('ncw').hidden = !e.target.checked; });

  /* تحديث "اليوم" عند منتصف الليل */
  setInterval(function () { var t = sod(new Date()); if (key(t) !== key(today)) { today = t; if (ov.hidden) render(); } }, 30000);

  render();
})();
</script>

</body></html>
